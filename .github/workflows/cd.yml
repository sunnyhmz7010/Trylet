name: CD

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Windows executable
        run: .\build.ps1

      - name: Test Go
        run: go test -count=1 -v ./...

      - name: Check Go
        run: go vet ./...

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Package portable Windows release
        run: .\build\package-release.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Trylet-windows-${{ matrix.arch }}
          path: release/windows/
          if-no-files-found: error

      - name: Upload files to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $files = @(
            'release/windows/Trylet-windows-${{ matrix.arch }}.exe',
            'release/windows/Trylet-windows-${{ matrix.arch }}-portable.zip',
            'release/windows/Trylet-windows-${{ matrix.arch }}-SHA256SUMS.txt'
          )
          if ('${{ matrix.arch }}' -eq 'amd64') { $files += 'release/windows/Trylet-source.zip' }
          gh release upload "$env:RELEASE_TAG" @files --clobber
