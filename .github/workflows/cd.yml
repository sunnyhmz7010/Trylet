name: CD

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Windows executable
        id: build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          .\build.ps1
          $version = $env:RELEASE_TAG
          if (-not $version) { $version = 'v' + (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version }
          $fileName = "Trylet-$version-windows-$env:BUILD_ARCH.exe"
          Move-Item -LiteralPath bin/Trylet.exe -Destination (Join-Path bin $fileName)
          "file=bin/$fileName" >> $env:GITHUB_OUTPUT

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.file }}
          archive: false
          if-no-files-found: error

      - name: Upload files to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_FILE: ${{ steps.build.outputs.file }}
        run: gh release upload "$env:RELEASE_TAG" "$env:RELEASE_FILE" --clobber
